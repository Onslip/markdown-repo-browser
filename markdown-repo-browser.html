function updateActiveTreeFile(path) {
  $tree.querySelectorAll('.tfile').forEach(a => {
    a.classList.toggle('active', a.dataset.path === path);
  });
}

function updateSearchVisibility() {
  const hasSearch = hasSearchableIndex();
  const isHttp   = location.protocol !== 'file:';
  const hasLocal = hasActiveLocalFolderSession();
  // Export button is visible whenever a local folder is open, regardless of protocol
  $exportBtn.style.display = hasLocal ? '' : 'none';
  if (isHttp && !hasLocal) {
    // http mode, no local folder — show search only if index.json was loaded
    $searchWrap.style.display = hasSearch ? '' : 'none';
    $httpHint.style.display   = hasSearch ? 'none' : 'block';
    if (!hasSearch) $httpHint.innerHTML =
      'To enable search &amp; file tree, open the source directory using the button above, ' +
      'then click the &#x2B07; icon next to the search bar to download <code>index.json</code> ' +
      'and place it next to <code>index.html</code>.';
  } else {
    $searchWrap.style.display = hasSearch ? '' : 'none';
    $httpHint.style.display   = 'none';
  }

  $search.disabled = !hasSearch;
  if (!hasSearch) {
    $search.value = '';
    $drop.classList.remove('open');
  }
}

function exportIndex() {
  const generatedAt = new Date().toISOString();
  const entries = normalizeIndexEntries(loader.index
    .map(({ path, title, words }) => ({
      path: loader.getDisplayPath(path),
      title,
      words
    }))
    .filter(entry => !loader.isIgnoredPath(entry.path)));

  const payload = buildCompactPayload(entries, generatedAt);

  const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'index.json'; a.click();
  URL.revokeObjectURL(url);

  if (hasActiveLocalFolderSession()) {
    setIndexMetadata(generatedAt);
  }
}

async function tryLoadHttpIndex() {
  try {
    const res = await fetch('index.json');
    if (!res.ok) return;
    const data = await res.json();
    const decoded = decodeCompactPayload(data);
    if (!decoded || decoded.entries.length === 0) return;

    loader.index = normalizeIndexEntries(decoded.entries);
    loader.rootPrefix = '';
    setIndexMetadata(decoded.generatedAt);

    refreshTree();
  } catch (_) {}
  updateSearchVisibility();
  updateHeaderMeta();
}

function refreshTree() {
  if (loader.index.length === 0) {
    updateSearchVisibility();
    updateHeaderMeta();
    return;
  }
  const treeSource = loader.index
    .map(entry => ({
      ...entry,
      path: loader.getDisplayPath(entry.path),
      name: loader.getDisplayPath(entry.path).split('/').pop() || entry.name
    }))
    .filter(entry => entry.path);

  const visibleFiles = treeSource.length > MAX_TREE_FILES
    ? treeSource.slice(0, MAX_TREE_FILES)
    : treeSource;
  $tree.innerHTML = renderTreeNode(buildTree(visibleFiles), currentPath);
  if (treeSource.length > MAX_TREE_FILES) {
    $idxSt.style.display = 'block';
    $idxSt.textContent = `Showing first ${MAX_TREE_FILES} files in tree (${treeSource.length} total). Search includes all files.`;
  }

  // Keep in-memory/history expansion state aligned with what is currently shown.
  expandedTreeDirs = captureExpandedTreeDirs();
  syncExpandedDirsToHistory();

  updateSearchVisibility();
  updateHeaderMeta();
}

function captureExpandedTreeDirs() {
  const out = new Set();
  $tree.querySelectorAll('details.tdir[open][data-dir]').forEach(d => {
    const p = normalizeRelPath(d.dataset.dir || '');
    if (p) out.add(p);
  });
  return out;
}

function syncExpandedDirsToHistory() {
  const expandedDirs = Array.from(expandedTreeDirs).sort(compareStable);
  const current = history.state;

  if (current) {
    history.replaceState({ ...current, expandedDirs }, '', location.href);
    return;
  }

  const path = readHash() || currentPath || '';
  const view = path ? 'file' : 'root';
  const fallback = makeHistoryState(view, path);
  history.replaceState({ ...fallback, expandedDirs }, '', location.href);
}

function beginPickerWait() {
  pickerWaiting = true;
  document.body.classList.add('picker-waiting');
  $pickerOverlay.classList.add('show');
  $banner.className = '';
  $error.className = '';
  $grantBtn.disabled = true;
  $idxSt.style.display = 'none';
}

function endPickerWait() {
  if (!pickerWaiting) return;
  pickerWaiting = false;
  document.body.classList.remove('picker-waiting');
  $pickerOverlay.classList.remove('show');
  if (!$grantBtn.textContent.includes('Re-scan')) {
    $grantBtn.disabled = false;
    $grantBtn.textContent = 'Open local directory…';
  }
  if (!indexBuilding) {
    $idxSt.style.display = 'none';
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   Grant directory access
   ═══════════════════════════════════════════════════════════════════════ */
async function grantAccess() {
  if (!window.showDirectoryPicker) {
    pickDirectory();
    return;
  }
  try {
    saveActiveSession();
    $grantBtn.disabled    = true;
    $grantBtn.innerHTML   = '<span class="spin" style="width:12px;height:12px;border-width:2px"></span> Scanning…';
    $idxSt.style.display  = 'block';
    $idxSt.textContent    = 'Opening directory…';

    await loader.requestAccess(lastDirHandle);
    lastDirHandle = loader.dirHandle;
    createSessionFromLoader();

    $idxSt.textContent   = `Found ${loader.index.length} markdown files. Building search index…`;
    $grantBtn.textContent = 'Open local directory…';
    $grantBtn.disabled    = false;

    refreshTree();
    pendingPath = null;
    await openPickedDirectoryRoot();

    // Build index in background
    if (!indexBuilding) {
      indexBuilding = true;
      loader.buildSearchIndex((done, total) => {
        $idxSt.textContent = `Indexing ${done}/${total}…`;
      }).then(() => {
        setIndexMetadata(new Date().toISOString());
        $idxSt.textContent = `✓ ${loader.index.length} files indexed and searchable.`;
        updateSearchVisibility();
        setTimeout(() => { $idxSt.style.display = 'none'; }, 4000);
        indexBuilding = false;
      }).catch(() => { indexBuilding = false; });
    }

  } catch (e) {
    $grantBtn.disabled    = false;
    $grantBtn.textContent = 'Open local directory…';
    $idxSt.style.display  = 'none';
    if (e.name !== 'AbortError') console.warn('Directory access error:', e);
  }
}

function pickFolder() {
  beginPickerWait();
  $folderInput.value = '';
  $folderInput.click();
}

function pickDirectory() {
  if (window.showDirectoryPicker) {
    grantAccess();
    return;
  }
  pickFolder();
}

async function ingestPickedFiles(fileList) {
  endPickerWait();
  const files = Array.from(fileList || []);
  if (files.length === 0) return;

  saveActiveSession();
  await loader.ingestPickedFiles(files);
  if (loader.index.length === 0) {
    activateSession(activeSessionId);
    $error.innerHTML = 'No .md or .mdx files were found in the selected files.';
    $error.className = 'show';
    return;
  }

  createSessionFromLoader();

  $idxSt.style.display = 'block';
  $idxSt.textContent = `Loaded ${loader.index.length} markdown files. Building search index in background…`;
  refreshTree();

  if (!indexBuilding) {
    indexBuilding = true;
    loader.buildSearchIndex((done, total) => {
      $idxSt.textContent = `Indexing ${done}/${total}…`;
    }).then(() => {
      setIndexMetadata(new Date().toISOString());
      $idxSt.textContent = `✓ ${loader.index.length} files indexed and searchable.`;
      updateSearchVisibility();
      setTimeout(() => { $idxSt.style.display = 'none'; }, 4000);
      indexBuilding = false;
    }).catch(() => { indexBuilding = false; });
  }

  pendingPath = null;
  await openPickedDirectoryRoot();
}

$grantBtn.addEventListener('click', grantAccess);
$exportBtn.addEventListener('click', exportIndex);
document.getElementById('banner-btn').addEventListener('click', grantAccess);
$folderInput.addEventListener('change', async (e) => {
  await ingestPickedFiles(e.target.files);
});
$folderInput.addEventListener('cancel', () => {
  endPickerWait();
});

$tree.addEventListener('toggle', (e) => {
  const details = e.target;
  if (!(details instanceof HTMLDetailsElement)) return;
  const dir = normalizeRelPath(details.dataset.dir || '');
  if (!dir) return;
  if (details.open) expandedTreeDirs.add(dir);
  else expandedTreeDirs.delete(dir);
  syncExpandedDirsToHistory();
}, true);

if ($content) {
  $content.addEventListener('scroll', updateActiveTocByScroll, { passive: true });
}

/* ═══════════════════════════════════════════════════════════════════════
   Search
   ═══════════════════════════════════════════════════════════════════════ */
$search.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(doSearch, 180);
});
$search.addEventListener('focus', () => { if ($search.value.trim()) doSearch(); });
$search.addEventListener('keydown', e => {
  if (e.key === 'Escape') { $drop.classList.remove('open'); $search.blur(); }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    const first = $drop.querySelector('.sr');
    if (first) first.focus();
  }
});
$drop.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); e.target.nextElementSibling?.focus(); }
  if (e.key === 'ArrowUp')   { e.preventDefault(); (e.target.previousElementSibling || $search).focus(); }
  if (e.key === 'Escape')    { $drop.classList.remove('open'); $search.focus(); }
});
document.addEventListener('click', e => {
  if (!e.target.closest('#search-wrap')) $drop.classList.remove('open');
});

function highlight(text, query) {
  if (!query) return escHtml(text);
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx < 0) return escHtml(text);
  return escHtml(text.slice(0, idx)) +
    '<mark>' + escHtml(text.slice(idx, idx + query.length)) + '</mark>' +
    escHtml(text.slice(idx + query.length));
}

function doSearch() {
  const q = $search.value.trim();
  if (!q || loader.index.length === 0) {
    $drop.classList.remove('open');
    return;
  }
  const ql = q.toLowerCase();
  const queryTokens = Array.from(new Set(tokenizeForSearch(q)));

  const results = loader.index
    .map(f => {
      const title = (f.title || f.name);
      const titleLc = title.toLowerCase();
      const pathLc = f.path.toLowerCase();
      let wordHits = 0;
      let allMatched = true;
      if (f.words instanceof Set && queryTokens.length > 0) {
        for (const tok of queryTokens) {
          let tokenWordMatch = false;
          if (f.words.has(tok)) {
            wordHits += 1;
            tokenWordMatch = true;
          }
          if (!tokenWordMatch && tok.length >= 3) {
            for (const w of f.words) {
              if (w.startsWith(tok)) {
                wordHits += 1;
                tokenWordMatch = true;
                break;
              }
            }
          }

          const tokenTitleMatch = titleLc.includes(tok);
          const tokenPathMatch = pathLc.includes(tok);
          if (!tokenWordMatch && !tokenTitleMatch && !tokenPathMatch) {
            allMatched = false;
            break;
          }
        }
      }

      let titleHits = 0;
      let pathHits = 0;
      if (queryTokens.length > 0) {
        for (const tok of queryTokens) {
          if (titleLc.includes(tok)) titleHits += 1;
          if (pathLc.includes(tok)) pathHits += 1;
        }
      } else {
        titleHits = titleLc.includes(ql) ? 1 : 0;
        pathHits = pathLc.includes(ql) ? 1 : 0;
      }

      const score =
        (titleHits * 3) +
        (pathHits * 2) +
        wordHits;
      return { f, score, allMatched };
    })
    .filter(r => r.allMatched && r.score > 0)
    .sort((a,b) => (b.score - a.score) || compareStable(a.f.path, b.f.path))
    .slice(0, 14)
    .map(r => r.f);

  if (results.length === 0) {
    $drop.innerHTML = `<div class="sr-empty">No results for "${escHtml(q)}"</div>`;
    $drop.classList.add('open');
    return;
  }

  $drop.innerHTML = results.map(f => {
    const title   = f.title || f.name;
    return `<a href="#${f.path}" class="sr" role="option" tabindex="0">
      <div class="sr-path">${escHtml(f.path)}</div>
      <div class="sr-title">${highlight(title, q)}</div>
    </a>`;
  }).join('');

  $drop.classList.add('open');

  $drop.querySelectorAll('.sr').forEach(el => {
    el.addEventListener('click', () => {
      $drop.classList.remove('open');
      $search.value = '';
    });
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   Prism autoloader path
   ═══════════════════════════════════════════════════════════════════════ */
if (window.Prism?.plugins?.autoloader) {
  Prism.plugins.autoloader.languages_path =
    'https://cdn.jsdelivr.net/npm/prismjs@1/components/';
}

/* ═══════════════════════════════════════════════════════════════════════
   Init
   ═══════════════════════════════════════════════════════════════════════ */
(function init() {
  // Restore theme
  try {
    const saved = localStorage.getItem('md-theme');
    if (saved === 'light' || saved === 'dark') theme = saved;
  } catch(_){}
  applyTheme();

  // Restore sidebar state
  try {
    if (localStorage.getItem('md-sidebar') === 'closed') {
      sidebarOpen = false;
      $sidebar.classList.add('closed');
    }
  } catch(_){}

  // Set up marked
  if (window.marked) {
    setupMarked();
  } else {
    // Retry when scripts have loaded
    window.addEventListener('load', () => { if (window.marked) setupMarked(); });
  }

  createSessionFromLoader();
  updateHeaderMeta();

  window.addEventListener('beforeunload', (e) => {
    if (!hasActiveLocalFolderSession()) return;
    e.preventDefault();
    e.returnValue = '';
  });

  navigate(readHash() || DEFAULT_FILE, { noPush: true });

  updateSearchVisibility();
  if (location.protocol !== 'file:') tryLoadHttpIndex();
})();
</script>
</body>
